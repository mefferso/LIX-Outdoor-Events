<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LIX Outdoor Events</title>
  <meta name="description" content="Operational map of significant outdoor events across the NWS LIX CWA.">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>LIX Outdoor Events</h1>
      <p>Significant outdoor gatherings · Today through Day 7 · Central Time</p>
    </div>
    <div class="status-wrap">
      <div id="freshness" class="freshness">Loading data…</div>
      <button id="sourceHealth" class="source-health" type="button" aria-expanded="false">Sources loading…</button>
      <div id="sourceHealthPanel" class="source-health-panel" hidden></div>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Map controls">
      <div id="dateStrip" class="date-strip" aria-label="Forecast day"></div>
      <div class="filter-row">
        <div id="categoryFilters" class="filters" aria-label="Event category">
          <button class="filter active" data-category="all">All</button>
          <button class="filter" data-category="sports">Sports</button>
          <button class="filter" data-category="festival">Festivals / Concerts</button>
          <button class="filter" data-category="race_parade">Races / Parades</button>
          <button class="filter" data-category="coastal_marine">Coastal / Marine</button>
          <button class="filter" data-category="other">Other</button>
        </div>
        <label class="major-toggle">
          <input id="majorOnly" type="checkbox">
          Major only
        </label>
        <div id="eventCount" class="event-count">0 events</div>
      </div>
    </section>

    <section class="workspace">
      <div id="map" aria-label="Outdoor events map"></div>
      <aside id="eventList" class="event-list" aria-label="Events on selected day"></aside>
    </section>
  </main>

  <template id="emptyTemplate">
    <div class="empty-state">
      <strong>No mapped events for this selection.</strong>
      <span>That can mean there are no qualifying events, or a source has not identified one yet.</span>
    </div>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
