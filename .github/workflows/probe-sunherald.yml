name: Probe Sun Herald Calendar

on:
  push:
    paths:
      - ".github/workflows/probe-sunherald.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public CitySpark portal routes
        shell: bash
        run: |
          set +e
          urls=(
            "https://portal.cityspark.com/SunHerald"
            "https://p.cityspark.com/SunHerald"
            "https://p.cityspark.com/Portal/SunHerald"
            "https://p.cityspark.com/Test/Portal/SunHerald"
            "https://p.cityspark.com/Test/Portal/SunHerald/"
            "https://p.cityspark.com/Portal.aspx?portal=SunHerald"
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            curl -sS -L --connect-timeout 10 --max-time 25 \
              -D /tmp/h.txt -o /tmp/b.txt \
              -w 'HTTP=%{http_code} SIZE=%{size_download} FINAL=%{url_effective}\n' "$u"
            grep -Ei '^(HTTP/|location:|content-type:)' /tmp/h.txt | tail -n 8 || true
            head -c 800 /tmp/b.txt | tr '\n' ' ' || true
            echo
          done
