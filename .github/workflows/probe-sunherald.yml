name: Probe Sun Herald Calendar

on:
  push:
    paths:
      - ".github/workflows/probe-sunherald.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe CitySpark public widget event endpoint
        shell: bash
        run: |
          set +e
          urls=(
            "https://cdn-p.cityspark.com/wid/SunHerald_17969802.jsx"
            "https://cdn-p.cityspark.com/wid/SunHerald_17969802.jsx?callback=testcb"
            "https://cdn-p.cityspark.com/wid/SunHerald_19440135.jsx?callback=testcb"
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/h.txt -o /tmp/b.txt "$u"
            grep -Ei '^(HTTP/|content-type:|location:)' /tmp/h.txt | tail -n 10 || true
            echo "SIZE $(wc -c < /tmp/b.txt)"
            head -c 5000 /tmp/b.txt
            echo
          done
