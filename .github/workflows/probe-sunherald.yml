name: Probe Sun Herald Calendar

on:
  push:
    paths:
      - ".github/workflows/probe-sunherald.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe CitySpark escaped-fragment date routing through renderer
        shell: bash
        run: |
          set +e
          urls=(
            "https://www.sunherald.com/events/"
            "https://www.sunherald.com/events/?_escaped_fragment_=!/show?start=2026-09-25"
            "https://www.sunherald.com/events/?_escaped_fragment_=/show?start=2026-09-25"
          )
          for target in "${urls[@]}"; do
            echo "=== TARGET $target ==="
            enc_target="${target// /%20}"
            curl -sS -L --connect-timeout 10 --max-time 90 \
              -H 'X-Respond-Timing: mutation-idle' \
              -H 'X-Engine: browser' \
              -H 'X-Timeout: 60' \
              -o /tmp/rendered.txt \
              "https://r.jina.ai/$enc_target"
            echo "SIZE $(wc -c < /tmp/rendered.txt)"
            grep -E '^(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday), Sep|https://www\.sunherald\.com/events/#/details/' /tmp/rendered.txt | head -n 80 || true
            echo
          done
