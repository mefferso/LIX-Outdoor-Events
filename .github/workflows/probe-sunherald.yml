name: Probe Sun Herald Calendar

on:
  push:
    paths:
      - ".github/workflows/probe-sunherald.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render Sun Herald calendar through external reader
        shell: bash
        run: |
          set +e
          curl -L --connect-timeout 10 --max-time 90 \
            -H 'X-With-Iframe: true' \
            -H 'X-With-Shadow-Dom: true' \
            -H 'X-Respond-Timing: mutation-idle' \
            -H 'X-Engine: browser' \
            -H 'X-Timeout: 60' \
            -o /tmp/rendered.txt \
            'https://r.jina.ai/https://www.sunherald.com/events/'

          echo "=== SIZE ==="
          wc -c /tmp/rendered.txt || true

          echo "=== EVVNT / API CLUES ==="
          grep -Eio '.{0,120}(evvnt|publisher[_-]?id|home_page_events|_evDiscoveryPath|discovery\.evvnt\.com|api[_-]?key).{0,240}' /tmp/rendered.txt | head -n 200 || true

          echo "=== POSSIBLE PUBLISHER IDS ==="
          grep -Eio '(publisher[_-]?id|api/publisher/)[^0-9]{0,12}[0-9]{2,10}' /tmp/rendered.txt | sort -u | head -n 100 || true

          echo "=== FIRST 120 LINES ==="
          sed -n '1,120p' /tmp/rendered.txt || true
