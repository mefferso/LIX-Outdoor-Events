name: Probe Sun Herald Calendar

on:
  push:
    paths:
      - ".github/workflows/probe-sunherald.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe rendered CitySpark detail route
        shell: bash
        run: |
          set +e
          u="https://r.jina.ai/https://www.sunherald.com/events/%23/details/the-firefighters-at-loco-beach-coconuts/17969802/2026-09-26T00"
          curl -sS -L --connect-timeout 10 --max-time 90 \
            -H 'X-Respond-Timing: mutation-idle' \
            -H 'X-Engine: browser' \
            -H 'X-Timeout: 60' \
            -o /tmp/detail.txt "$u"
          echo "SIZE $(wc -c < /tmp/detail.txt)"
          cat /tmp/detail.txt
