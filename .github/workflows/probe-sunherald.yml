name: Probe Sun Herald Calendar

on:
  push:
    paths:
      - ".github/workflows/probe-sunherald.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect CitySpark public widget loader
        shell: bash
        run: |
          set +e
          curl -sS -L --connect-timeout 10 --max-time 30 \
            -D /tmp/h.txt -o /tmp/widget.js \
            'https://cdn.cityspark.com/wid/get.js'
          echo "=== HEADERS ==="
          grep -Ei '^(HTTP/|content-type:|location:)' /tmp/h.txt || true
          echo "=== SIZE ==="
          wc -c /tmp/widget.js || true
          echo "=== URL/API CLUES ==="
          grep -Eo 'https?[^"'"'"' ]+|/[A-Za-z0-9._/?=&%-]*(event|widget|wid)[A-Za-z0-9._/?=&%-]*' /tmp/widget.js | head -n 150 || true
          echo "=== SCRIPT ==="
          cat /tmp/widget.js
