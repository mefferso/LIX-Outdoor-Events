name: Probe Sun Herald Calendar API

on:
  push:
    paths:
      - ".github/workflows/probe-sunherald-evvnt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch Sun Herald events shell over HTTP 1.1
        shell: bash
        run: |
          set +e
          curl --http1.1 -L --compressed --connect-timeout 10 --max-time 45 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -D /tmp/headers.txt \
            -o /tmp/page.html \
            'https://www.sunherald.com/events/'
          code=$?
          echo "CURL_EXIT=$code"
          echo '=== HEADERS ==='
          cat /tmp/headers.txt || true
          echo '=== SIZE ==='
          wc -c /tmp/page.html || true
          echo '=== TITLE ==='
          grep -Eio '<title[^>]*>[^<]+' /tmp/page.html | head -5 || true
          echo '=== VENDOR/API MARKERS ==='
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/page.html')
          text=p.read_text(errors='replace') if p.exists() else ''
          keys=('evvnt','discovery','publisher_id','api_key','westworld','calendar','iframe','eventbrite','events')
          for line in text.splitlines():
              low=line.lower()
              if any(k in low for k in keys):
                  print(line[:3000])
          print('=== SCRIPT SRCS ===')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
              print(src)
          print('=== IFRAMES ===')
          for src in re.findall(r'<iframe[^>]+src=["\']([^"\']+)', text, re.I):
              print(src)
          PY
